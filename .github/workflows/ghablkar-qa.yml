name: Ghablkar MVP QA

on:
  push:
    branches: ["omind-forge-ghablkar"]
  pull_request:
    branches: ["main"]

jobs:
  static-qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ghablkar
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: node --check app.js
      - name: Validate required assets and markers
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          grep -q 'قبل‌کار' index.html
          grep -q 'قیمت مرجع' index.html
          grep -q 'requestForm' app.js
          grep -q 'localStorage' app.js
      - name: Verify bilingual font setup
        run: |
          grep -q 'vazirmatn' index.html
          grep -q 'Vazirmatn' styles.css
